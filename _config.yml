theme: minimal-mistakes-jekyll
locale: "en-US"
title: "José Manuel Martínez Martínez"
name: "José Manuel Martínez Martínez"
description: "data science, data engineering, AI, ML, NLP"

author:
  name: "José Manuel Martínez Martínez"
  avatar: "https://avatars0.githubusercontent.com/u/2077497?v=3&s=460"
  bio: "Born in Valencia 🍊🔥, Spain. Passionate about AI, ML, NLP, data, agile."
  uri: "https://chozelinek.github.io"
  github: chozelinek
  linkedin: josé-manuel-martínez-martínez-15b118b

include:
    - "_pages"

exclude:
    - LICENSE
    - README.md
    - Gemfile
    - Gemfile.lock
    - .nojekyll

defaults:
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
    #   comments: true
      share: true
      related: true
  # _archives
  - scope:
      path: ""
      type: liquid
    values:
      author_profile: true

plugins:
    - jekyll/paginate

paginate: 5 # amount of posts to show
paginate_path: /blog/page:num/

category_archive:
    type: liquid
    path: /categories/
tag_archive:
    type: liquid
    path: /tags/
